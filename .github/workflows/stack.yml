name: Stack

# Vérifie la pile Docker (code/stack) à chaque changement. Le déploiement se fait à la main (code/stack/deploy.sh) : le mini PC ne parle pas à GitHub.
on:
  push:
    branches: [main]
    paths: ['code/stack/**', '.github/workflows/stack.yml']
  pull_request:
    paths: ['code/stack/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stack-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { dir: code/stack/api, scripts: 'typecheck lint test' }
          - { dir: code/stack/sync, scripts: 'typecheck lint test' }
          - { dir: code/stack/motion, scripts: 'typecheck lint test' }
          - { dir: code/stack/web, scripts: 'typecheck lint test build', ui: true }
          - { dir: code/stack/sync/web, scripts: 'typecheck lint test build', ui: true }
          - { dir: code/stack/ui, scripts: 'typecheck lint test' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Les apps consomment @house/ui en source (file:../ui) : ses dépendances d'abord.
      - if: ${{ matrix.ui }}
        run: npm --prefix code/stack/ui ci
      - run: npm ci
        working-directory: ${{ matrix.dir }}
      # Un script absent est ignoré (tous les paquets n'ont pas encore leurs tests).
      - run: |
          for s in ${{ matrix.scripts }}; do
            if node -e "process.exit(require('./package.json').scripts?.['$s'] ? 0 : 1)"; then npm run "$s"; fi
          done
        working-directory: ${{ matrix.dir }}
