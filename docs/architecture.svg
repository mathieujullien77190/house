<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title>Architecture du site house</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1f2a37"/>
    </marker>
  </defs>
  <rect width="1000" height="520" fill="#ffffff"/>

  <!-- Hébergement -->
  <rect x="20" y="20" width="180" height="480" rx="14" fill="#f3f7fb" stroke="#9db3c8" stroke-width="1.5"/>
  <text x="40" y="48" font-size="15" font-weight="700" fill="#1f2a37">Hébergement</text>
  <rect x="35" y="90" width="150" height="110" rx="10" fill="#ffffff" stroke="#1f2a37" stroke-width="1.5"/>
  <text x="110" y="120" font-size="14" font-weight="700" text-anchor="middle" fill="#1f2a37">GitHub Actions</text>
  <text x="110" y="144" font-size="11.5" text-anchor="middle" fill="#5b6b7c">push sur main</text>
  <text x="110" y="162" font-size="11.5" text-anchor="middle" fill="#5b6b7c">tsc + vite build</text>
  <text x="110" y="180" font-size="11.5" text-anchor="middle" fill="#5b6b7c">(base /house/)</text>
  <rect x="35" y="250" width="150" height="90" rx="10" fill="#ffffff" stroke="#1f2a37" stroke-width="1.5"/>
  <text x="110" y="284" font-size="14" font-weight="700" text-anchor="middle" fill="#1f2a37">GitHub Pages</text>
  <text x="110" y="308" font-size="11.5" text-anchor="middle" fill="#5b6b7c">site statique (dist/)</text>
  <path d="M110 200 V248" stroke="#1f2a37" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <text x="120" y="228" font-size="11.5" fill="#1f2a37">déploie</text>

  <!-- Navigateur -->
  <rect x="260" y="20" width="500" height="480" rx="14" fill="#f3f7fb" stroke="#9db3c8" stroke-width="1.5"/>
  <text x="280" y="48" font-size="15" font-weight="700" fill="#1f2a37">Navigateur (aucun serveur, aucune API)</text>

  <rect x="290" y="70" width="440" height="64" rx="10" fill="#ffffff" stroke="#1f2a37" stroke-width="1.5"/>
  <text x="510" y="98" font-size="15" font-weight="700" text-anchor="middle" fill="#1f2a37">App (React 19)</text>
  <text x="510" y="118" font-size="12.5" text-anchor="middle" fill="#5b6b7c">assemble la page : en-tête, phases 0 / 1 / 2, schéma, panneaux</text>

  <rect x="290" y="170" width="440" height="84" rx="10" fill="#fff7ec" stroke="#b5651d" stroke-width="1.5"/>
  <text x="510" y="200" font-size="15" font-weight="700" text-anchor="middle" fill="#1f2a37">useDiagram</text>
  <text x="510" y="222" font-size="12.5" text-anchor="middle" fill="#5b6b7c">état du schéma : composants (nodes) et liaisons (links)</text>
  <text x="510" y="240" font-size="12.5" text-anchor="middle" fill="#5b6b7c">ajout, déplacement, zones, suppression de liens</text>

  <rect x="290" y="300" width="210" height="180" rx="10" fill="#ffffff" stroke="#1f2a37" stroke-width="1.5"/>
  <text x="395" y="328" font-size="14" font-weight="700" text-anchor="middle" fill="#1f2a37">Modèle (fonctions pures)</text>
  <g font-size="12" text-anchor="middle" fill="#5b6b7c">
    <text x="395" y="354">nodes : types, schéma par défaut</text>
    <text x="395" y="376">wiring : autoWire, wireInfra</text>
    <text x="395" y="398">geometry : tracé des liens</text>
    <text x="395" y="420">catalog : prix, avertissements</text>
    <text x="395" y="442">plan · linkInfo · glossary</text>
  </g>

  <rect x="520" y="300" width="210" height="180" rx="10" fill="#ffffff" stroke="#1f2a37" stroke-width="1.5"/>
  <text x="625" y="328" font-size="14" font-weight="700" text-anchor="middle" fill="#1f2a37">Vues</text>
  <g font-size="12" text-anchor="middle" fill="#5b6b7c">
    <text x="625" y="354">Diagram + HousePlan (SVG)</text>
    <text x="625" y="376">InfoPanel · K3s · Secteur</text>
    <text x="625" y="398">Pricing (tableau des prix)</text>
    <text x="625" y="420">CameraDialog : schéma 2D</text>
  </g>
  <rect x="535" y="432" width="180" height="36" rx="8" fill="#eaf5ea" stroke="#4a8a4a" stroke-width="1.2"/>
  <text x="625" y="454" font-size="12" font-weight="700" text-anchor="middle" fill="#1f2a37">vue 3D three.js (lazy)</text>

  <!-- Stockage -->
  <path d="M820 190 v70 c0 14 30 22 80 22 s80 -8 80 -22 v-70 c0 -14 -30 -22 -80 -22 s-80 8 -80 22 z" fill="#eaf5ea" stroke="#4a8a4a" stroke-width="1.5"/>
  <ellipse cx="900" cy="190" rx="80" ry="22" fill="#d6ecd6" stroke="#4a8a4a" stroke-width="1.5"/>
  <text x="900" y="236" font-size="14" font-weight="700" text-anchor="middle" fill="#1f2a37">localStorage</text>
  <text x="900" y="256" font-size="11.5" text-anchor="middle" fill="#5b6b7c">house-diagram-v15</text>

  <!-- Flèches -->
  <g stroke="#1f2a37" stroke-width="1.6" fill="none" marker-end="url(#arrow)">
    <path d="M200 295 H260"/>
    <path d="M510 134 V168"/>
    <path d="M395 254 V298"/>
    <path d="M625 254 V298"/>
    <path d="M730 190 H760 H818"/>
    <path d="M818 230 H730"/>
  </g>
  <g font-size="11.5" fill="#1f2a37">
    <text x="230" y="285" text-anchor="middle">HTML + JS</text>
    <text x="520" y="156">hook</text>
    <text x="405" y="282">utilise</text>
    <text x="635" y="282">props</text>
    <text x="790" y="180" text-anchor="middle">écrit</text>
    <text x="790" y="248" text-anchor="middle">lit</text>
  </g>
</svg>
