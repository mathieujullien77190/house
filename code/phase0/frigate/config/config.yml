# Configuration minimale de Frigate pour la phase 0 (une Reolink).
# Les clés exactes peuvent changer selon la version de Frigate : à vérifier dans sa documentation.

mqtt:
  enabled: false

auth:
  enabled: true

go2rtc:
  streams:
    # Adresse IP de la Reolink sur le réseau de la maison, fixée par un bail DHCP statique sur la box.
    # Chemins RTSP de Reolink : à vérifier selon le modèle (h264 ou h265).
    portail_main: rtsp://admin:{FRIGATE_REOLINK_PASSWORD}@192.168.1.141:554/h264Preview_01_main
    portail_sub: rtsp://admin:{FRIGATE_REOLINK_PASSWORD}@192.168.1.141:554/h264Preview_01_sub
    # Le direct de la WebApp : le flux léger transcodé en MJPEG (un ffmpeg, seulement tant qu'un onglet le regarde).
    # Nom = celui du flux + _mjpeg : House API le déduit de l'adresse que House Sync a écrite.
    portail_sub_mjpeg: ffmpeg:portail_sub#video=mjpeg

cameras:
  portail:
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/portail_main
          input_args: preset-rtsp-restream
          roles:
            - record
        - path: rtsp://127.0.0.1:8554/portail_sub
          input_args: preset-rtsp-restream
          roles:
            - detect
    detect:
      enabled: true
    # Plus sensible que les réglages d'usine (score minimal 0,5, confirmation à 0,7) : la caméra voit de près,
    # une personne à moitié dans le champ n'atteignait pas 70 %.
    objects:
      track:
        - person
      filters:
        person:
          min_score: 0.4
          threshold: 0.6
    # Flux proposés dans la vue direct de Frigate ; House Sync prend le premier pour l'iframe de la WebApp
    # (le flux léger, en H264, que tous les navigateurs décodent).
    live:
      streams:
        Léger: portail_sub
        Principal: portail_main
    # House Sync copie les clips et garde une image par minute : Frigate n'a besoin de garder que quelques heures
    # (0.25 jour = 6 h, le ménage passe toutes les heures), une marge si House Sync est arrêté un moment.
    record:
      enabled: true
      continuous:
        days: 0
      motion:
        days: 0.25
      alerts:
        retain:
          days: 0.25
      detections:
        retain:
          days: 0.25
version: 0.18-0
