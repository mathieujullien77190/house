<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>Chez Matou – Surveillance</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22304d"/>
      <stop offset="1" stop-color="#0d1424"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5f7fb"/>
      <stop offset="1" stop-color="#c3ccda"/>
    </linearGradient>
    <radialGradient id="eye" cx="0.5" cy="0.42" r="0.62">
      <stop offset="0" stop-color="#e2ff7a"/>
      <stop offset="0.55" stop-color="#93d43c"/>
      <stop offset="1" stop-color="#3c7615"/>
    </radialGradient>
  </defs>

  <!-- fond -->
  <rect width="256" height="256" rx="56" fill="url(#bg)"/>

  <!-- support -->
  <rect x="120" y="184" width="16" height="28" rx="4" fill="#8e9bb0"/>
  <rect x="90" y="206" width="76" height="16" rx="8" fill="#8e9bb0"/>

  <!-- oreilles -->
  <path d="M60 110 L76 48 L120 94 Z" fill="url(#body)"/>
  <path d="M196 110 L180 48 L136 94 Z" fill="url(#body)"/>
  <path d="M75 94 L81 66 L103 92 Z" fill="#ff9fb4"/>
  <path d="M181 94 L175 66 L153 92 Z" fill="#ff9fb4"/>

  <!-- moustaches -->
  <g stroke="#c3ccda" stroke-width="4" stroke-linecap="round">
    <line x1="56" y1="148" x2="22" y2="140"/>
    <line x1="56" y1="160" x2="22" y2="164"/>
    <line x1="200" y1="148" x2="234" y2="140"/>
    <line x1="200" y1="160" x2="234" y2="164"/>
  </g>

  <!-- boîtier caméra -->
  <rect x="48" y="90" width="160" height="98" rx="42" fill="url(#body)"/>

  <!-- objectif = œil de chat -->
  <circle cx="128" cy="140" r="40" fill="#1a2132"/>
  <circle cx="128" cy="140" r="31" fill="url(#eye)"/>
  <ellipse cx="128" cy="140" rx="7" ry="25" fill="#0a0e17"/>
  <circle cx="116" cy="127" r="6" fill="#ffffff" opacity="0.85"/>

  <!-- LED d'enregistrement -->
  <circle cx="186" cy="114" r="12" fill="#ff4757" opacity="0.25"/>
  <circle cx="186" cy="114" r="6" fill="#ff4757"/>
</svg>
