# La pile du mini PC : go2rtc (les flux des caméras), motion (l'enregistreur), House Sync, House API + WebApp, et un
# conteneur éphémère pour les certificats. Démarrage : voir README.md.

services:
  # Conteneur éphémère : crée la CA de la maison et le certificat du PC dans data/certs, puis s'arrête.
  # House Sync et l'API attendent qu'il ait fini pour démarrer avec ce certificat.
  certs:
    build: ./certs
    restart: "no"
    environment:
      CERT_HOSTS: ${CERT_HOSTS}
    volumes:
      - ./data/certs:/certs

  # go2rtc : une seule connexion RTSP vers chaque caméra, qu'il partage (RTSP interne, MJPEG, image à l'instant).
  # Ni son RTSP (8554) ni son API (1984) ne sont publiés : seuls les autres conteneurs les voient.
  go2rtc:
    image: alexxit/go2rtc:latest
    restart: unless-stopped
    environment:
      REOLINK_PASSWORD: ${REOLINK_PASSWORD}
      # La deuxième caméra (voliere-interieur) : adresse et compte, lus par go2rtc.yaml.
      CAMERA2_IP: ${CAMERA2_IP:-}
      CAMERA2_USER: ${CAMERA2_USER:-admin}
      CAMERA2_PASSWORD: ${CAMERA2_PASSWORD:-}
      # La troisième caméra (salon-de-jardin) : adresse et compte, lus par go2rtc.yaml.
      CAMERA3_IP: ${CAMERA3_IP:-}
      CAMERA3_USER: ${CAMERA3_USER:-admin}
      CAMERA3_PASSWORD: ${CAMERA3_PASSWORD:-}
      # La quatrième caméra (voliere-toit) : adresse et compte, lus par go2rtc.yaml.
      CAMERA4_IP: ${CAMERA4_IP:-}
      CAMERA4_USER: ${CAMERA4_USER:-admin}
      CAMERA4_PASSWORD: ${CAMERA4_PASSWORD:-}
    volumes:
      - ./go2rtc/go2rtc.yaml:/config/go2rtc.yaml:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:1984/api"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - sync_net
      # Le réseau de la page invité : elle ne voit que go2rtc.
      - guest_net

  # L'enregistreur (voir motion/CLAUDE.md), pour les quatre caméras (voliere-exterieur, voliere-interieur, salon-de-jardin et voliere-toit) : enregistre le flux principal
  # par segments, détecte le mouvement sur le flux léger, fabrique les clips, et offre à House Sync une petite API (non publiée, sans mot de passe).
  motion:
    build: ./motion
    restart: unless-stopped
    depends_on:
      - go2rtc
    environment:
      CAMERAS: voliere-exterieur,voliere-interieur,salon-de-jardin,voliere-toit
      GO2RTC_RTSP: rtsp://go2rtc:8554
      GO2RTC_API: http://go2rtc:1984
      # 6 h de segments gardées : House Sync a le temps de copier les clips s'il est arrêté un moment.
      RETENTION_HOURS: "6"
      # Les clips qui se recouvrent sont fusionnés en un seul quand le dernier a cet âge (minutes).
      MERGE_DELAY_MINUTES: "30"
      # Le son de ces caméras, gardé seulement avec leurs clips de mouvement (un fichier .aac par clip, à part de la vidéo qui reste sans son) :
      # de petits fichiers de 10 s, gardés comme les segments vidéo (6 h), dont on tire le son de chaque clip.
      AUDIO_CAMERAS: voliere-interieur
      # Les caméras dehors, sous la pluie : leur détection ignore les gouttes et les traits de pluie (seules les taches comptent). Pas pour la cage : un oiseau est petit.
      AUDIO_SEGMENT_SECONDS: "10"
      # Le micro des Reolink est très faible (environ -55 dB) : le son des clips est amplifié de ce gain, en dB (0 : tel quel).
      AUDIO_GAIN_DB: "24"
    volumes:
      - ./data/recordings:/recordings
      - ./data/clips:/data
    healthcheck:
      test: ["CMD", "node", "-e", "require('net').connect(8080, '127.0.0.1').on('connect', () => process.exit(0)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - sync_net

  sync:
    build:
      # Le contexte est le dossier stack : la page de House Sync consomme le paquet ui.
      context: .
      dockerfile: sync/Dockerfile
    restart: unless-stopped
    depends_on:
      motion:
        condition: service_started
      certs:
        condition: service_completed_successfully
    environment:
      # Les enregistreurs (un par machine), séparés par des virgules : leur API est interne, sans mot de passe.
      RECORDER_URLS: ${RECORDER_URLS:-http://motion:8080}
      # Le pont Philips Hue : son adresse (House Sync lit sa fiche publique, sans clé, pour dire s'il est joignable) et la clé
      # d'application, la même que l'API : House Sync écoute le flux d'événements du pont et garde le journal des lampes
      # (table hue_events, d'où vient chaque changement). Sans clé, le journal reste inactif.
      HUE_BRIDGE_IP: ${HUE_BRIDGE_IP:-}
      HUE_APP_KEY: ${HUE_APP_KEY:-}
      # La page de House Sync (base SQLite et disque backup), derrière la même clé que l'API, en HTTPS.
      HOUSE_KEY: ${API_KEY}
      PAGE_PORT: "8081"
      TLS_CERT: /certs/cert.pem
      TLS_KEY: /certs/key.pem
      DATA_DIR: /data
      POLL_INTERVAL_SECONDS: "5"
      # Une image par caméra (une par minute par défaut, réglable depuis la page), gardée la durée de garde ci-dessous.
      SNAPSHOT_INTERVAL_SECONDS: "60"
      # La durée de garde, en jours (réglable depuis la page, qui prend le dessus). Une fois par jour, vers 4 h (heure de Paris), House Sync efface
      # au-delà : les clips non sauvegardés, les images, le journal des lampes Hue, les événements sans clip et les fusions. Les clips sauvegardés
      # depuis la WebApp (liste écrite par l'API dans data/house) ne sont jamais effacés, ni leurs événements.
      CLIP_RETENTION_DAYS: ${CLIP_RETENTION_DAYS:-15}
      SAVED_CLIPS_FILE: /house/saved-clips.json
      ZONES_FILE: /house/zones.json
      GUEST_STATE_FILE: /guest/state.json
      # Les visites de la page invité (une ligne JSON par visite, importée toutes les 15 s dans la table guest_visits), lues dans le dossier que la page remplit.
      GUEST_VISITS_FILE: /guest-visits/visits.jsonl
      # Le lien de la page invité (guest/) : la page Réglages l'affiche (clé comprise) avec un bouton « Copier le lien » (GET /api/guest, derrière la session). GUEST_PUBLIC_URL :
      # son adresse publique si elle est ouverte à internet (sinon la page prend son propre hôte et le port 8090).
      GUEST_KEY: ${GUEST_KEY:-}
      GUEST_PUBLIC_URL: ${GUEST_PUBLIC_URL:-}
      # Le journal des activations du chauffage (écrit par House API dans data/house, importé toutes les 30 s dans la table heating_log).
      HEATING_LOG_FILE: /house/heating-log.jsonl
      # Le journal des ordres aux volets roulants (écrit par House API dans data/house, importé toutes les 30 s dans la table shutter_log).
      SHUTTER_LOG_FILE: /house/shutters-log.jsonl
      # Le journal des connexions des invités de la Freebox (écrit par House API dans data/house, importé toutes les 30 s dans la table box_connections).
      BOX_LOG_FILE: ${BOX_LOG_FILE:-/house/box-connections.jsonl}
      # La position de la maison (par défaut la Seine-et-Marne) : le lever et le coucher du soleil du mode « La nuit » des clips.
      HOUSE_LATITUDE: ${HOUSE_LATITUDE:-48.52}
      HOUSE_LONGITUDE: ${HOUSE_LONGITUDE:-2.64}
      # go2rtc : House Sync y change la cadence des directs (curseurs de sa page).
      GO2RTC_URL: http://go2rtc:1984
      # La consommation : la puissance du processeur (fichier de power/house-power.sh) et le PoE des caméras (House API).
      POWER_FILE: /power/cpu.json
      API_URL: https://api:8080
      API_CA_FILE: /certs/rootCA.pem
      API_SERVERNAME: localhost
    ports:
      - "8081:8081"
    volumes:
      - ./data/backup:/data
      - ./data/certs:/certs:ro
      - ./data/power:/power:ro
      # La liste des clips sauvegardés, écrite par l'API : lue seulement, avant d'effacer les vieux clips.
      - ./data/house:/house:ro
      # L'interrupteur de la page invité (bouton « En ligne / Coupée » des réglages) : le seul fichier que House Sync écrit pour elle, hors du disque backup.
      # Le dossier data/guest doit exister, créé par l'utilisateur de la machine (sinon Docker le crée pour root et House Sync ne peut pas y écrire).
      - ./data/guest:/guest
      # Le journal des visites que la page invité écrit : lu seulement (le dossier data/guest-visits doit exister, créé par l'utilisateur de la machine).
      - ./data/guest-visits:/guest-visits:ro
      # Le nom et le système de la machine (le conteneur a les siens) : deux fichiers de l'hôte, en lecture seule.
      # Le docker-compose.yml tel qu'il est lancé (références ${VARIABLE} seulement, pas de secret) : l'onglet Docker le montre.
      - ./docker-compose.yml:/host/docker-compose.yml:ro
      - /etc/hostname:/host/hostname:ro
      - /etc/os-release:/host/os-release:ro
      # Le /sys de l'hôte, en lecture seule : l'état des cartes réseau physiques (câble RJ45, WiFi) de la page Machine.
      - /sys:/host/sys:ro
    healthcheck:
      test: ["CMD", "node", "-e", "require('net').connect(8081, '127.0.0.1').on('connect', () => process.exit(0)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - sync_net

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    restart: unless-stopped
    depends_on:
      certs:
        condition: service_completed_successfully
    environment:
      DATA_DIR: /data
      # La clé que l'utilisateur donne depuis la WebApp ; l'API ne démarre pas sans.
      API_KEY: ${API_KEY}
      # go2rtc : le direct (MJPEG) et l'image à l'instant, relayés par l'API.
      GO2RTC_URLS: ${GO2RTC_URLS:-http://go2rtc:1984}
      # Le switch PoE : l'API coupe ou rend le PoE du port d'une caméra (page web du switch). Sans mot de passe, le service poe répond 503.
      SWITCH_URL: http://192.168.1.33
      SWITCH_USER: ${SWITCH_USER:-admin}
      SWITCH_PASSWORD: ${SWITCH_PASSWORD:-}
      # Caméra:port du switch, séparés par des virgules.
      SWITCH_PORTS: voliere-exterieur:3,voliere-interieur:4,salon-de-jardin:7,voliere-toit:8
      # Le pont Philips Hue (réseau de la maison) : l'adresse et la clé d'application, créée par un appui sur le bouton du pont.
      # Sans clé, le service hue répond 503.
      HUE_BRIDGE_IP: ${HUE_BRIDGE_IP:-}
      HUE_APP_KEY: ${HUE_APP_KEY:-}
      # La prise connectée TP-Link Kasa (HS100) : son adresse sur le réseau de la maison et sa MAC. Si la box change son adresse,
      # l'API la retrouve toute seule par un scan du réseau (une fois par minute au plus). Sans adresse, le service plug répond 503.
      PLUG_HOST: ${PLUG_HOST:-}
      PLUG_MAC: ${PLUG_MAC:-D8:0D:17:1C:84:E3}
      # La Freebox (onglet Box) : API locale de la box, application autorisée et son jeton (secret, dans .env). Sans jeton, GET /box répond « non configurée ».
      FREEBOX_URL: ${FREEBOX_URL:-http://mafreebox.freebox.fr}
      FREEBOX_APP_ID: ${FREEBOX_APP_ID:-fr.house.home}
      FREEBOX_APP_TOKEN: ${FREEBOX_APP_TOKEN:-}
      # La télécommande du Freebox Player POP (onglet Box TV) : protocole Android TV Remote v2, ports 6466 (touches) et 6467 (appairage) du Player sur le réseau de la maison.
      # Aucun secret ici : le certificat client est gardé dans /state/tv (data/house/tv) après l'appairage depuis la WebApp.
      TV_HOST: ${TV_HOST:-192.168.1.47}
      # Les climatisations Mitsubishi : « id:nom:adresse du module Wi-Fi », séparées par des virgules (par exemple chambre-invite:Chambre invité:192.168.1.130). Vide : le service ac répond 503.
      AC_UNITS: ${AC_UNITS:-}
      # Les volets roulants Somfy RTS : « numéro dans le firmware:nom », séparés par des virgules. Sans SHUTTERS_ESP_URL (l'adresse de l'ESP32 qui fait
      # tourner ESPSomfy-RTS, par exemple http://192.168.1.60), c'est une SIMULATION : les ordres sont notés mais aucun signal radio ne part.
      SHUTTERS: ${SHUTTERS:-1:Volet PC,2:Volet salon,3:Volet porte,4:Volet cuisine}
      # (facultatif : « id:nom:secondes » donne le temps de fermeture complète d'un volet et active son bouton « Fermer à moitié »)
      SHUTTERS_ESP_URL: ${SHUTTERS_ESP_URL:-}
      # Les volets qui ont l'action « ouvrir au lever du soleil, fermer à son coucher » (leurs numéros) : la Vide : tous. Activée ensuite dans la WebApp, volet par volet.
      SHUTTERS_AUTO: ${SHUTTERS_AUTO:-}
      # Le chauffage automatique de la prise (voliere) : la température vient du détecteur Hue nommé ici (par défaut celui de PLUG_MOTION_SENSOR,
      # « motion interieur »), la nuit se calcule pour la position de la maison (les mêmes valeurs par défaut que House Sync). Les réglages de la règle sont dans data/house/heating.json.
      PLUG_TEMPERATURE_SENSOR: ${PLUG_TEMPERATURE_SENSOR:-}
      HOUSE_LATITUDE: ${HOUSE_LATITUDE:-48.52}
      HOUSE_LONGITUDE: ${HOUSE_LONGITUDE:-2.64}
      # L'enregistreur : le bouton « Enregistrer » de la WebApp (un clip lancé à la main) lui parle par l'API.
      RECORDER_URL: http://motion:8080
      # Ce que l'API écrit : les positions des ampoules sur le plan et la liste des clips sauvegardés (data/house, créé par l'utilisateur de la machine).
      STATE_DIR: /state
      # Le certificat de la maison : HTTPS pour la WebApp.
      TLS_CERT: /certs/cert.pem
      TLS_KEY: /certs/key.pem
      # Le certificat PUBLIC de l'autorité de la maison, à télécharger depuis un téléphone (/rootCA.crt).
      CA_CERT: /certs/rootCA.crt
    ports:
      - "8080:8080"
    volumes:
      # Lecture seule : l'API ne modifie jamais les clips, la base ni les certificats.
      - ./data/backup:/data:ro
      - ./data/certs:/certs:ro
      - ./data/house:/state
    healthcheck:
      test: ["CMD", "node", "-e", "require('net').connect(8080, '127.0.0.1').on('connect', () => process.exit(0)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - web_net
      # Pour joindre go2rtc (go2rtc:1984), qui n'est jamais publié.
      - sync_net

  # Le site de la maison (voir site/CLAUDE.md) : schémas, Architecture, explications, vue Code, Storybook. Des fichiers compilés par
  # deploy.sh, servis par nginx en HTTPS sur le port 8082. Aucune donnée, aucun réseau : il ne parle à personne.
  site:
    build: ./site
    restart: unless-stopped
    depends_on:
      certs:
        condition: service_completed_successfully
    ports:
      - "8082:8082"
    volumes:
      # Seulement le certificat et sa clé (pas la clé de la CA), en lecture seule.
      - ./data/certs/cert.pem:/certs/cert.pem:ro
      - ./data/certs/key.pem:/certs/key.pem:ro
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "-q", "-O", "/dev/null", "https://127.0.0.1:8082/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 64m
    networks:
      - web_net

  # La page invité (voir guest/CLAUDE.md) : le direct léger des caméras, pour quelqu'un à qui on donne un lien. Éteinte par défaut (profil
  # « guest » : un « docker compose up -d » ne la lance pas). Allumer : docker compose up -d --build guest. Éteindre complètement :
  # docker compose stop guest (elle reste éteinte après un redémarrage de la machine). Un conteneur à part : pas de disque, pas de base,
  # un réseau à elle avec go2rtc seulement, et rien d'autre ne dépend d'elle.
  guest:
    profiles: [guest]
    build: ./guest
    restart: unless-stopped
    depends_on:
      go2rtc:
        condition: service_started
      certs:
        condition: service_completed_successfully
    environment:
      # La clé du lien (https://<adresse>:8090/?k=<clé>), 16 caractères au moins, dans .env : sans elle la page ne démarre pas.
      GUEST_KEY: ${GUEST_KEY:-}
      GUEST_CAMERAS: ${GUEST_CAMERAS:-voliere-exterieur,voliere-interieur}
      # Le nombre de personnes qui regardent en même temps au plus, et la durée d'un flux (minutes).
      GUEST_MAX_VIEWERS: ${GUEST_MAX_VIEWERS:-5}
      GUEST_MAX_MINUTES: ${GUEST_MAX_MINUTES:-30}
      GO2RTC_URL: http://go2rtc:1984
      PORT: "8090"
      # L'interrupteur écrit par House Sync (lecture seule) : « Coupée », la page ferme son port.
      GUEST_STATE_FILE: /guest/state.json
      # Le journal des visites (qui vient, quand, ce qu'il regarde) : le seul dossier où la page écrit, House Sync l'importe.
      GUEST_VISITS_FILE: /visits/visits.jsonl
      TLS_CERT: /certs/cert.pem
      TLS_KEY: /certs/key.pem
    ports:
      - "8090:8090"
    volumes:
      - ./data/certs/cert.pem:/certs/cert.pem:ro
      - ./data/certs/key.pem:/certs/key.pem:ro
      - ./data/guest:/guest:ro
      - ./data/guest-visits:/visits
    # Pas de healthcheck : son port est fermé exprès quand l'interrupteur de la page invité est coupé (House Sync).
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    networks:
      - guest_net

networks:
  sync_net:
  web_net:
  guest_net:
