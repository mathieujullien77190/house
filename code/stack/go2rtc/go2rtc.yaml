# go2rtc : une seule connexion RTSP vers chaque caméra, partagée avec l'enregistreur (motion) et la WebApp.
# Le mot de passe de la caméra vient de la variable d'environnement REOLINK_PASSWORD (.env), jamais d'ici.
# Par caméra, six flux : <nom>_main (4K, enregistré en copie), <nom>_sub (léger, détection),
# <nom>_sub_mjpeg (le léger transcodé en MJPEG, que House API relaie pour le direct) et
# <nom>_main_mjpeg (le 4K transcodé en MJPEG, pour le bouton « 4K » du direct : lourd pour le processeur).
# Les mêmes deux flux en « _m » (<nom>_sub_mjpeg_m, <nom>_main_mjpeg_m) sont ceux des écrans de moins de 1024 px : leur cadence se règle à part.
streams:
  perruche-fond_main: rtsp://admin:${REOLINK_PASSWORD}@192.168.1.141:554/h264Preview_01_main
  perruche-fond_sub: rtsp://admin:${REOLINK_PASSWORD}@192.168.1.141:554/h264Preview_01_sub
  perruche-fond_sub_mjpeg: ffmpeg:perruche-fond_sub#video=mjpeg
  perruche-fond_main_mjpeg: ffmpeg:perruche-fond_main#video=mjpeg
  perruche-fond_sub_mjpeg_m: ffmpeg:perruche-fond_sub#video=mjpeg
  perruche-fond_main_mjpeg_m: ffmpeg:perruche-fond_main#video=mjpeg
  # La deuxième caméra : adresse, compte et mot de passe viennent de .env (CAMERA2_IP, CAMERA2_USER, CAMERA2_PASSWORD).
  perruche-porte_main: rtsp://${CAMERA2_USER}:${CAMERA2_PASSWORD}@${CAMERA2_IP}:554/h264Preview_01_main
  perruche-porte_sub: rtsp://${CAMERA2_USER}:${CAMERA2_PASSWORD}@${CAMERA2_IP}:554/h264Preview_01_sub
  perruche-porte_sub_mjpeg: ffmpeg:perruche-porte_sub#video=mjpeg
  perruche-porte_main_mjpeg: ffmpeg:perruche-porte_main#video=mjpeg
  perruche-porte_sub_mjpeg_m: ffmpeg:perruche-porte_sub#video=mjpeg
  perruche-porte_main_mjpeg_m: ffmpeg:perruche-porte_main#video=mjpeg

# Le direct (4K et léger) en MJPEG avec moins d'images par seconde : House Sync change la source de <nom>_main_mjpeg et
# <nom>_sub_mjpeg en ffmpeg:<nom>_main#video=mjpegN ou ffmpeg:<nom>_sub#video=mjpegN (N de 1 à 24) selon le curseur de sa page. Décoder reste complet, mais l'encodage JPEG et le
# débit baissent. Ces modèles doivent exister ici : go2rtc ne les crée pas à chaud.
ffmpeg:
  mjpeg1: "-c:v mjpeg -force_duplicated_matrix:v 1 -huffman:v 0 -pix_fmt:v yuvj420p -r 1"
  mjpeg2: "-c:v mjpeg -force_duplicated_matrix:v 1 -huffman:v 0 -pix_fmt:v yuvj420p -r 2"
  mjpeg3: "-c:v mjpeg -force_duplicated_matrix:v 1 -huffman:v 0 -pix_fmt:v yuvj420p -r 3"
  mjpeg4: "-c:v mjpeg -force_duplicated_matrix:v 1 -huffman:v 0 -pix_fmt:v yuvj420p -r 4"
  mjpeg5: "-c:v mjpeg -force_duplicated_matrix:v 1 -huffman:v 0 -pix_fmt:v yuvj420p -r 5"
  mjpeg6: "-c:v mjpeg -force_duplicated_matrix:v 1 -huffman:v 0 -pix_fmt:v yuvj420p -r 6"
  mjpeg7: "-c:v mjpeg -force_duplicated_matrix:v 1 -huffman:v 0 -pix_fmt:v yuvj420p -r 7"
  mjpeg8: "-c:v mjpeg -force_duplicated_matrix:v 1 -huffman:v 0 -pix_fmt:v yuvj420p -r 8"
  mjpeg9: "-c:v mjpeg -force_duplicated_matrix:v 1 -huffman:v 0 -pix_fmt:v yuvj420p -r 9"
  mjpeg10: "-c:v mjpeg -force_duplicated_matrix:v 1 -huffman:v 0 -pix_fmt:v yuvj420p -r 10"
  mjpeg11: "-c:v mjpeg -force_duplicated_matrix:v 1 -huffman:v 0 -pix_fmt:v yuvj420p -r 11"
  mjpeg12: "-c:v mjpeg -force_duplicated_matrix:v 1 -huffman:v 0 -pix_fmt:v yuvj420p -r 12"
  mjpeg13: "-c:v mjpeg -force_duplicated_matrix:v 1 -huffman:v 0 -pix_fmt:v yuvj420p -r 13"
  mjpeg14: "-c:v mjpeg -force_duplicated_matrix:v 1 -huffman:v 0 -pix_fmt:v yuvj420p -r 14"
  mjpeg15: "-c:v mjpeg -force_duplicated_matrix:v 1 -huffman:v 0 -pix_fmt:v yuvj420p -r 15"
  mjpeg16: "-c:v mjpeg -force_duplicated_matrix:v 1 -huffman:v 0 -pix_fmt:v yuvj420p -r 16"
  mjpeg17: "-c:v mjpeg -force_duplicated_matrix:v 1 -huffman:v 0 -pix_fmt:v yuvj420p -r 17"
  mjpeg18: "-c:v mjpeg -force_duplicated_matrix:v 1 -huffman:v 0 -pix_fmt:v yuvj420p -r 18"
  mjpeg19: "-c:v mjpeg -force_duplicated_matrix:v 1 -huffman:v 0 -pix_fmt:v yuvj420p -r 19"
  mjpeg20: "-c:v mjpeg -force_duplicated_matrix:v 1 -huffman:v 0 -pix_fmt:v yuvj420p -r 20"
  mjpeg21: "-c:v mjpeg -force_duplicated_matrix:v 1 -huffman:v 0 -pix_fmt:v yuvj420p -r 21"
  mjpeg22: "-c:v mjpeg -force_duplicated_matrix:v 1 -huffman:v 0 -pix_fmt:v yuvj420p -r 22"
  mjpeg23: "-c:v mjpeg -force_duplicated_matrix:v 1 -huffman:v 0 -pix_fmt:v yuvj420p -r 23"
  mjpeg24: "-c:v mjpeg -force_duplicated_matrix:v 1 -huffman:v 0 -pix_fmt:v yuvj420p -r 24"

rtsp:
  listen: ":8554"

api:
  listen: ":1984"
