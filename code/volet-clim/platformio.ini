; Boîtier volet + clim : un ESP32, un module radio CC1101 (volets Somfy RTS) et une LED infrarouge (pompe à chaleur Mitsubishi).
[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = min_spiffs.csv
lib_deps =
    tzapu/WiFiManager@^2.0.17
    crankyoldgit/IRremoteESP8266@^2.8.6
    lsatan/SmartRC-CC1101-Driver-Lib@^2.5.7
build_flags =
    -DCORE_DEBUG_LEVEL=0

; Mise à jour sans fil, une fois le boîtier sur le Wi-Fi : pio run -e ota -t upload
[env:ota]
extends = env:esp32dev
upload_protocol = espota
upload_port = volet-clim.local
upload_flags =
    --auth=volet-clim
